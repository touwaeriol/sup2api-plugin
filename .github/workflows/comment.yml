# Posts the result of check.yml on its pull request and sets the
# needs-review label. Runs from the default branch with a write token, so it
# never checks out or runs PR code: the artifact is read as data only and the
# PR is looked up through the API.
name: comment

on:
  workflow_run:
    workflows: [check]
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  comment:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout scripts (default branch)
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Download check result
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: registry-check
          path: ${{ runner.temp }}/registry-check
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Comment and label
        uses: actions/github-script@v7
        env:
          RESULT_DIR: ${{ runner.temp }}/registry-check
        with:
          script: |
            const report = require('./.github/scripts/report.js');
            await report({ github, context, core, dir: process.env.RESULT_DIR });
